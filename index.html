<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply saved theme before first paint to avoid a white flash in dark mode
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('labtech_ui_prefs_v1') || '{}');
          var t = p.theme || 'light';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) { document.documentElement.classList.add('dark'); document.documentElement.style.colorScheme = 'dark'; }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />
    <meta name="description" content="Civil &amp; Geotechnical Testing Laboratory Information Management System (PC &amp; Mobile Dual-Shell UI) with live Google Drive 30TB &amp; Google Sheets database sync." />
    <meta property="og:title" content="LabTech Nexus LIMS" />
    <meta property="og:description" content="Civil &amp; Geotechnical Testing Laboratory Information Management System (PC &amp; Mobile Dual-Shell UI) with live Google Drive 30TB &amp; Google Sheets database sync." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LabTech" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>LabTech Nexus LIMS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
